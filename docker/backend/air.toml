# Configuración de Air para el contenedor de desarrollo (Linux).
# En Windows/local se sigue usando el .air.toml de la raíz.
#
# La fuente se sincroniza con `docker compose watch`; Air detecta los cambios
# dentro del contenedor y recompila.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ."
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "testdata", "apps", "packages", "node_modules", "docker", "scripts", "specs", "tasks"]
  delay = 1000
  stop_on_error = true
  kill_delay = 500

[log]
  add_time = true
  main_only = false
  silent = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
