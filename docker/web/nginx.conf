# nginx del contenedor web: sirve la SPA y hace de reverse proxy del API.
# Se copia a /etc/nginx/conf.d/default.conf (contexto http).
#
# Un solo origen (decisión D-45): la SPA y el API comparten dominio, así que
# no hay CORS y la CSP puede usar connect-src 'self'.

# Conserva el esquema original cuando hay un proxy TLS delante (Traefik/Dokploy).
# En local (HTTP) se queda en $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # El import del backend acepta hasta 8 MiB; nginx corta en 1 MiB por defecto.
    client_max_body_size 9m;

    # CSP + cabeceras de seguridad de la SPA (SPEC-client-hardening CH-2/CH-3).
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Healthcheck local del contenedor (no toca el API).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Resolución en runtime: si el contenedor api se recrea con otra IP, nginx
    # no se queda con la IP vieja (Docker DNS responde en 127.0.0.11).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # El API ya emite estas cabeceras; se evita duplicarlas con las del server.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # Swagger UI (solo si SWAGGER_ENABLED=true). Usa scripts/estilos inline,
    # por eso este location relaja la CSP y re-declara el resto de cabeceras
    # (en nginx, un add_header en el location anula los heredados).
    location /swagger/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Assets con hash de Vite: cache inmutable de 1 año.
    # `expires` no anula los add_header heredados (no es add_header).
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html sin cache para que un deploy se vea de inmediato.
    location = /index.html {
        expires -1;
    }

    # SPA fallback de Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
