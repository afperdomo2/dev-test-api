name: Containers CI

# Construye las imágenes de producción y valida los 3 compose.
# No publica imágenes: el deploy lo hace Dokploy con su propio builder.
#
# No es un check obligatorio de `main` (los obligatorios son backend, shared,
# web y gitleaks). Se ejecuta solo cuando cambian archivos relacionados.

on:
  push:
    branches: [main, develop]
    paths:
      - "docker/**"
      - "apps/web/deploy/**"
      - "apps/web/package.json"
      - "packages/shared/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - ".github/workflows/containers.yml"
  pull_request:
    paths:
      - "docker/**"
      - "apps/web/deploy/**"
      - "apps/web/package.json"
      - "packages/shared/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - ".github/workflows/containers.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores dummy: `compose config` solo necesita que la interpolación resuelva.
  DB_PASSWORD: ci-password
  JWT_SECRET: ci-jwt-secret-not-a-real-secret
  APP_ORIGIN: https://ci.example.com

jobs:
  images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          # Vacío = same-origin (nginx proxya /api).
          build-args: |
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  compose:
    name: Validate compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Validate dev / prod-local / dokploy
        run: |
          docker compose -f docker/compose.dev.yaml \
            --env-file docker/env/.env.dev.example config -q
          docker compose -f docker/compose.prod.yaml \
            --env-file docker/env/.env.prod.example config -q
          docker compose -f docker/compose.dokploy.yaml \
            --env-file docker/env/.env.dokploy.example config -q
