name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/shared/**"]
  pull_request:
    paths: ["apps/web/**", "packages/shared/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm prettier --check src/

      - name: Lint
        run: pnpm eslint . --ext .vue,.ts,.tsx

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test:run --coverage

      - name: Build
        run: pnpm build
