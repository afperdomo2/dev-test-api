name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ["**.go", "go.mod", "go.sum", ".github/workflows/backend.yml"]
  # Sin `paths`: un PR que solo toca docs también debe reportar este check
  # obligatorio (si no, la rama queda "Expected" y no se puede mergear).
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -short -count=1 ./...
