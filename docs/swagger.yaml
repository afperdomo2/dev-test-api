host: localhost:8080
info:
  contact:
    email: felipe@example.com
    name: Felipe
  description: REST API con Go + Gin · Auth JWT · PostgreSQL · Swagger
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: dev-test-api
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentica un usuario y devuelve un token JWT
      parameters:
      - description: Credenciales de login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.APIError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apierr.APIError'
      summary: Iniciar sesión
      tags:
      - auth
  /api/v1/auth/setup:
    post:
      consumes:
      - application/json
      description: Crea el primer usuario admin del sistema. Solo funciona si no hay
        usuarios creados y el body incluye un `setupToken` válido (SETUP_TOKEN del
        servidor). Sin token o con token incorrecto responde 403; si ya hay usuarios,
        409.
      parameters:
      - description: Credenciales del admin inicial + setupToken
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SetupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierr.APIError'
        "409":
          description: System Already Initialized
          schema:
            $ref: '#/definitions/apierr.APIError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apierr.APIError'
      summary: Inicializar sistema (primer usuario admin)
      tags:
      - auth
  /api/v1/auth/status:
    get:
      description: Indica si el sistema ya fue inicializado (tiene al menos un usuario)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.StatusResponse'
      summary: Estado del sistema
      tags:
      - auth
  /api/v1/gamification/badges:
    get:
      description: Catálogo de logros con su estado (conseguido o progreso), evaluado
        al vuelo. Sin tabla de logros.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gamification.BadgesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.APIError'
      security:
      - BearerAuth: []
      summary: Ver logros
      tags:
      - gamification
  /api/v1/gamification/daily-goal:
    put:
      consumes:
      - application/json
      description: Fija la meta diaria de XP del usuario autenticado (entre 10 y 200).
        Devuelve el reward con la meta actualizada.
      parameters:
      - description: Meta diaria
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/gamification.DailyGoalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gamification.Reward'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.APIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apierr.APIError'
      security:
      - BearerAuth: []
      summary: Cambiar meta diaria de XP
      tags:
      - gamification
  /api/v1/gamification/overview:
    get:
      description: Devuelve XP total, nivel, racha, meta diaria y XP por tema del
        usuario autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gamification.OverviewResponse'
        "401":
          description: Unauthorized
          schema:
