min_version: 2.0.0
glob_matcher: doublestar

# Estrategia de filtrado:
#   - Cada job declara `glob` (y `root` cuando aplica) para que lefthook lo salte
#     si no hay archivos de ese stack. Sin glob, un job corre SIEMPRE.
#   - pre-commit filtra sobre {staged_files} (git diff --cached, --diff-filter=ACMR).
#   - pre-push filtra sobre {push_files} (git diff HEAD @{push}).
#   - Los globs se evalúan siempre desde la raíz del repo, aunque haya `root`.
#     `root` solo cambia el CWD y hace las rutas relativas a ese directorio.

pre-commit:
  parallel: true
  jobs:
    - name: go-format
      glob: "**/*.go"
      run: bash scripts/fmt-staged.sh {staged_files}
      stage_fixed: true

    - name: go-vet
      glob: "**/*.go"
      run: bash scripts/go-vet-affected.sh {staged_files}
      fail_text: "❌ go vet failed"

    - name: go-test
      glob: "**/*.go"
      run: bash scripts/go-test-affected.sh {staged_files}
      fail_text: "❌ unit tests failed"

    - name: shared-typecheck
      glob: ["packages/shared/**/*.ts", "packages/shared/package.json"]
      root: packages/shared/
      run: pnpm typecheck
      fail_text: "❌ shared type-check failed"

    - name: fe-format
      glob: "apps/web/**/*.{ts,vue,tsx,js,scss,css,json}"
      root: apps/web/
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    - name: fe-lint
      glob: "apps/web/**/*.{ts,vue,tsx}"
      root: apps/web/
      run: pnpm eslint {staged_files}
      fail_text: "❌ frontend lint failed"

    - name: fe-type-check
      glob: ["apps/web/**/*.{ts,vue,tsx}", "apps/web/tsconfig*.json", "apps/web/package.json", "apps/web/vite.config.ts"]
      root: apps/web/
      run: pnpm type-check
      fail_text: "❌ frontend type-check failed"

    - name: fe-test
      glob: "apps/web/**/*.{ts,vue,tsx}"
      root: apps/web/
      run: pnpm vitest related {staged_files}
      fail_text: "❌ frontend unit tests failed"

    # Sin `root`: un cambio en shared también debe type-checkear mobile, y `root`
    # filtraría los archivos fuera de apps/mobile/.
    - name: mobile-type-check
      glob: ["apps/mobile/**/*.{ts,tsx}", "apps/mobile/tsconfig.json", "packages/shared/**/*.ts"]
      run: pnpm --filter mobile typecheck
      fail_text: "❌ mobile type-check failed"

    - name: mobile-lint
      glob: "apps/mobile/**/*.{ts,tsx}"
      root: apps/mobile/
      run: pnpm eslint {staged_files}
      fail_text: "❌ mobile lint failed"

    - name: mobile-test
      glob: "apps/mobile/**/*.{ts,tsx}"
      root: apps/mobile/
      run: pnpm test:related {staged_files}
      fail_text: "❌ mobile unit tests failed"

# Estrategia de concurrencia (por qué hay `group` y no 13 jobs sueltos):
#   - `parallel: true` arriba abre solo 3 grupos (un proceso pesado por stack).
#   - Dentro de cada grupo los jobs corren en secuencia: build/test de Go no
#     compiten entre sí, y jest/vitest no se pelean por los mismos cores.
#   - Cada stack tiene su propio `glob`, así que un push de solo docs no arranca nada.
#   - Se quedan FUERA los checks que ya corren en pre-commit (afectados) y CI
#     (completo): `fe-build`, `eslint .`, `go vet ./...`, `vue-tsc --build`.
#     Duplicarlos aquí añadía 4-5 min al push sin detectar nada nuevo.
#   - Sin límite, 8 cores/14 GB ejecutaban jest (7 workers) + vitest (8 threads) +
#     vite build + vue-tsc + go build/test a la vez: los tests más lentos
#     (TopicPicker) agotaban `testTimeout` y el worker se forzaba a salir.
pre-push:
  parallel: true
  jobs:
    # --- backend: vet/build/test en serie dentro del grupo ---
    - name: backend
      group:
        jobs:
          - name: go-fmt
            glob: ["**/*.go", "go.mod", "go.sum"]
            run: bash scripts/check-fmt.sh
            fail_text: "❌ go fmt failed — ejecuta make fmt"

          - name: go-build
            glob: ["**/*.go", "go.mod", "go.sum"]
            run: go build ./...
            fail_text: "❌ go build failed"

          # `go vet` completo no va aquí: pre-commit lo corre sobre los paquetes
          # afectados y CI (`backend.yml`) sobre todo el repo. Duplicarlo costaba
          # ~70 s de push sin detectar nada nuevo.
          - name: go-test
            glob: ["**/*.go", "go.mod", "go.sum"]
            # 120s: con el runner bajo carga, `notifications` (sleeps + scheduler)
            # llegaba a 48s y el límite anterior de 60s lo dejaba al borde.
            run: go test -short -count=1 -timeout 120s ./...
            fail_text: "❌ unit tests failed"

    # --- frontend: solo si se empujan cambios de web o de shared ---
    - name: web
      group:
        jobs:
          - name: fe-format-check
            glob: "apps/web/**/*.{ts,vue,tsx,js,scss,css,json}"
            # --cache: 3 s en re-ejecuciones (antes ~20 s sin cambios).
            run: cd apps/web && pnpm prettier --check --cache src/
            fail_text: "❌ frontend format failed — ejecuta pnpm format"

          # Fuera de pre-push, a propósito:
          #   - `eslint .` completo: pre-commit lintea lo staged y CI todo.
          #   - `vue-tsc --build` (≈100 s): pre-commit lo corre en cada cambio web
          #     staged y CI lo corre en cada push/PR. Duplicarlo aquí era el job
          #     más caro del hook.
          # Si el push incluye commits hechos con `--no-verify`, CI es la red.
          - name: fe-test
            glob: ["apps/web/**/*.{ts,vue,tsx,js,scss,css,json}", "packages/shared/**/*.ts"]
            # 6 workers: vitest con jsdom es el job más caro (≈150 s standalone).
            run: cd apps/web && pnpm test:run -- --maxWorkers=6
            fail_text: "❌ frontend unit tests failed"

    # --- mobile: sin CI propia, así que pre-push es su único gate ---
    - name: mobile
      group:
        jobs:
          - name: mobile-type-check
            glob: ["apps/mobile/**/*.{ts,tsx}", "apps/mobile/tsconfig.json", "packages/shared/**/*.ts"]
            run: pnpm --filter mobile typecheck
            fail_text: "❌ mobile type-check failed"

          - name: mobile-test
            glob: ["apps/mobile/**/*.{ts,tsx}", "apps/mobile/package.json", "packages/shared/**/*.ts"]
            run: pnpm --filter mobile test:run
            fail_text: "❌ mobile unit tests failed"
