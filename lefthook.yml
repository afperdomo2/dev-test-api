glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: go-fmt
      glob: "**/*.go"
      run: sh scripts/check-fmt.sh

    - name: go-vet
      glob: ["**/*.go", "go.mod", "go.sum"]
      run: go vet ./...

    - name: go-test
      glob: ["**/*.go", "go.mod", "go.sum"]
      run: go test -short -count=1 -timeout 60s ./...
      fail_text: "❌ unit tests failed"

    - name: fe-format
      glob: "frontend/**/*.{ts,vue,tsx,js,scss,css,json}"
      run: cd frontend && pnpm prettier --write src/
      stage_fixed: true

    - name: fe-lint
      glob: ["frontend/**/*.{ts,vue,tsx}", "frontend/.eslintrc.json", "frontend/package.json"]
      run: cd frontend && pnpm eslint . --ext .vue,.ts,.tsx

    - name: fe-type-check
      glob: ["frontend/**/*.{ts,vue,tsx}", "frontend/tsconfig*.json", "frontend/package.json", "frontend/vite.config.ts"]
      run: cd frontend && pnpm vue-tsc --build --noEmit

    - name: fe-test
      glob: ["frontend/**/*.{ts,vue,tsx}", "frontend/package.json", "frontend/vite.config.ts"]
      run: cd frontend && pnpm test:run
      fail_text: "❌ frontend unit tests failed"
