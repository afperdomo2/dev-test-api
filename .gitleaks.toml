# gitleaks — configuración del repo
#
# Objetivo: detectar secretos en el árbol y en la historia completa sin
# silenciar rutas de producción. La allowlist cubre únicamente ejemplos,
# fixtures de test, seeds y documentación generada.
#
# Uso local:
#   gitleaks detect --source . --redact --no-banner
#   gitleaks protect --staged --redact
#
# Ver specs/SPEC-secrets-hygiene.md.

[extend]
useDefault = true

[[allowlists]]
description = "Ejemplos, tests, seeds y documentación generada"
paths = [
  '''\.env\.example$''',
  '''apps/[^/]+/\.env\.example$''',
  '''(^|/)testdata/''',
  '''(^|/)db/seeds/''',
  '''(^|/)docs/swagger\.(json|yaml)$''',
  '''(^|/).*\.test\.(ts|tsx)$''',
  '''apps/web/e2e/fixtures\.ts$''',
]
regexes = [
  '''(?i)(cambia-esto|placeholder|dummy|changeme|your[-_]?key)''',
]
# La clave PEM ficticia que aparecía como ejemplo en SPEC-secrets-hygiene.md
# (commit fec36b7) es de juguete y no protege nada. Se permite por su cuerpo
# exacto para no silenciar claves reales; el texto ya no se usa como canario.
stopwords = ["seedDummyHash", "ExponentPushToken", "7bq3vXk9mQ2sT8wZ1nR4cY6uJ0pL5hG3fD2aE9sK8mV7xN1oP"]
