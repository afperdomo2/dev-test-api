# Cabeceras de seguridad para la SPA (SPEC-client-hardening CH-2/CH-3).
#
# Se incluyen desde el server{} que sirve el build de Vite:
#   include /etc/nginx/snippets/security-headers.conf;
#
# Same-origin (decisión D-45): la SPA y el API comparten dominio porque nginx
# proxya /api → api:8080. Si separás el API en otro dominio, agregá su origen
# a connect-src.
#
# Notas:
# - style-src 'unsafe-inline' es necesario: Vuetify inyecta estilos.
# - script-src 'self' es viable: Vite emite <script type="module" src="...">.
# - HSTS lo ignoran los navegadores sobre HTTP; en Dokploy el borde es HTTPS.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
